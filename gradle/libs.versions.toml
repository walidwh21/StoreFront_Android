[versions]
agp = "8.9.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.27"
hilt = "2.56.1"
googleServices = "4.4.2"
composeBom = "2024.09.00"
coreKtx = "1.16.0"
lifecycle = "2.8.7"
activityCompose = "1.10.1"
